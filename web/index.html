<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HouseCheck</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f5d8a'/%3E%3Cpath d='M4 8.5l2.6 2.6L12 5.8' stroke='%23fff' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/card.css">
<style>
  :root {
    --ink: #16181d; --dim: #6b7079; --line: #e2e2df; --paper: #fbfbf9;
    --ground: #f2f2ef; --accent: #2f5d8a; --user: #e8e8e2;
    font-synthesis-weight: none;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8e8e4; --dim: #9a9ea6; --line: #32343a; --paper: #191b1f; --ground: #101114; --accent: #79a8d6; --user: #26282d; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  header.top {
    border-bottom: 1px solid var(--line); background: var(--paper);
    padding: 14px 20px; display: flex; align-items: baseline; gap: 12px;
  }
  header.top h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  header.top .sub { color: var(--dim); font-size: 12.5px; }
  header.top .link { margin-left: auto; color: var(--dim); font-size: 12px; }

  main { flex: 1; overflow-y: auto; }
  .thread { max-width: 780px; margin: 0 auto; padding: 28px 20px 8px; }

  .turn { margin-bottom: 20px; }
  .turn.you { display: flex; justify-content: flex-end; }
  .turn.you p {
    margin: 0; max-width: 78%; background: var(--user); color: var(--ink);
    padding: 9px 14px; border-radius: 16px 16px 4px 16px;
  }
  .turn.it > p { margin: 0 0 12px; max-width: 92%; }
  .turn.it .aside { color: var(--dim); font-size: 13px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chips button {
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 999px; padding: 6px 13px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .chips button:hover { border-color: var(--accent); color: var(--accent); }

  .dots span {
    display: inline-block; width: 5px; height: 5px; margin-right: 4px; border-radius: 50%;
    background: var(--dim); animation: b 1.1s infinite;
  }
  .dots span:nth-child(2) { animation-delay: .15s } .dots span:nth-child(3) { animation-delay: .3s }
  @keyframes b { 0%,60%,100% { opacity: .25 } 30% { opacity: .9 } }

  footer.compose { border-top: 1px solid var(--line); background: var(--paper); padding: 14px 20px 18px; }
  .composer { max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px;
    background: var(--ground); color: var(--ink); padding: 11px 14px; font: inherit;
    max-height: 140px; min-height: 44px;
  }
  .composer textarea:focus { outline: none; border-color: var(--accent); }
  .composer button {
    height: 44px; padding: 0 20px; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600;
  }
  .composer button:disabled { opacity: .45; cursor: default; }
  .status { max-width: 780px; margin: 8px auto 0; color: var(--dim); font-size: 11.5px; }
  .status b { font-weight: 600; color: var(--ink); }
</style>
</head>
<body>

<header class="top">
  <h1>HouseCheck</h1>
  <span class="sub">Is <em>your</em> unit recalled?</span>
  <span class="link" id="conn">connecting…</span>
</header>

<main><div class="thread" id="thread"></div></main>

<footer class="compose">
  <form class="composer" id="form">
    <textarea id="input" rows="1" placeholder="Name a product, or paste a barcode" autocomplete="off"></textarea>
    <button type="submit" id="send">Ask</button>
  </form>
  <p class="status">Offline over a frozen snapshot of <b id="corpus">FDA and CPSC</b> notices. Verdicts come from the HouseCheck MCP server over Streamable HTTP.</p>
</footer>

<script type="module">
// ---------------------------------------------------------------------------
// Minimal MCP client over Streamable HTTP. The server runs stateless with JSON
// responses, so a plain fetch per JSON-RPC message is the whole transport.
// ---------------------------------------------------------------------------
const SPEC = '2025-11-25';
let id = 0;

async function rpc(method, params, notify = false) {
  const body = notify ? { jsonrpc: '2.0', method, params } : { jsonrpc: '2.0', id: ++id, method, params };
  const res = await fetch('/mcp', {
    method: 'POST',
    headers: { 'content-type': 'application/json', accept: 'application/json, text/event-stream', 'mcp-protocol-version': SPEC },
    body: JSON.stringify(body),
  });
  if (notify) return null;
  const text = await res.text();
  // enableJsonResponse is on, but accept an SSE framing too rather than assume.
  const json = JSON.parse(
    res.headers.get('content-type')?.includes('text/event-stream')
      ? text.split('\n').filter((l) => l.startsWith('data:')).map((l) => l.slice(5).trim()).join('')
      : text,
  );
  if (json.error) throw new Error(json.error.message);
  return json.result;
}

async function callTool(name, args) {
  const r = await rpc('tools/call', { name, arguments: args });
  if (r.isError) throw new Error(r.content?.[0]?.text ?? 'tool failed');
  return r;
}

// ---------------------------------------------------------------------------
// transcript
// ---------------------------------------------------------------------------
const thread = document.getElementById('thread');
const input = document.getElementById('input');
const send = document.getElementById('send');

const scroll = () => thread.parentElement.scrollTo({ top: thread.scrollHeight + 400, behavior: 'smooth' });

function turn(who, html) {
  const el = document.createElement('div');
  el.className = `turn ${who}`;
  el.innerHTML = html;
  thread.append(el);
  scroll();
  return el;
}

const say = (text, cls = '') => turn('it', `<p class="${cls}">${text}</p>`);
const you = (text) => turn('you', `<p></p>`).querySelector('p').append(text);

function thinking() {
  return turn('it', '<p class="dots"><span></span><span></span><span></span></p>');
}

function chips(el, options) {
  const box = document.createElement('div');
  box.className = 'chips';
  for (const label of options) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.onclick = () => { box.remove(); submit(label); };
    box.append(b);
  }
  el.append(box);
  scroll();
}

// ---------------------------------------------------------------------------
// conversation state
//
// The server decides; this only remembers what the owner has told us so far and
// which code the server last asked for, so the next thing they type fills it.
// ---------------------------------------------------------------------------
const CODE_KEYS = ['lot','julian','best_by','expiry','mfg_date','date_code','model','serial','udi','software','plant'];
let unit = {};
let product = '';
let awaiting = null;
let busy = false;

const isBarcode = (s) => /^[\d\s-]{8,20}$/.test(s.trim()) && s.replace(/\D/g, '').length >= 8;

function reset() {
  unit = {}; product = ''; awaiting = null;
}

async function submit(raw) {
  const text = raw.trim();
  if (!text || busy) return;
  busy = true; send.disabled = true;
  you(text);
  const wait = thinking();

  try {
    if (awaiting) {
      unit[awaiting] = text;
      awaiting = null;
    } else if (isBarcode(text)) {
      unit.upc = text;
    } else {
      reset();
      product = text;
    }

    const r = await callTool('check_recall', { product, ...unit, limit: 3 });
    const s = r.structuredContent ?? {};
    wait.remove();
    render(s, r);
  } catch (err) {
    wait.remove();
    say(`Could not reach the recall service: ${String(err.message ?? err)}`, 'aside');
  } finally {
    busy = false; send.disabled = false; input.focus();
  }
}

const HEAD = {
  AFFECTED: 'This unit is in the recall.',
  NOT_AFFECTED: 'This unit is outside the recall.',
  NEED_CODE: 'I need one more code off the package before I can decide.',
};

function render(s, r) {
  if (!s.results?.length) return void say(r.content?.[0]?.text ?? 'Nothing matched.', 'aside');

  const top = s.results[0];
  const el = say(HEAD[top.verdict] ?? '');
  for (const card of s.cards ?? []) el.insertAdjacentHTML('beforeend', card);

  if (top.verdict === 'NEED_CODE' && top.questions?.length) {
    const next = (top.missing_codes ?? []).find((k) => CODE_KEYS.includes(k));
    const q = document.createElement('p');
    q.textContent = top.questions[0];
    el.append(q);
    if (next) awaiting = next;
  }
  if (top.verdict === 'AFFECTED') {
    const p = document.createElement('p');
    p.className = 'aside';
    p.textContent = top.remedy_verbatim
      ? 'The remedy above is the recalling firm’s own wording, unedited.'
      : 'This record carries no remedy text, so the primary source notice is the place to go.';
    el.append(p);
  }
  if (s.results.length > 1) {
    const p = document.createElement('p');
    p.className = 'aside';
    p.textContent = `${s.results.length - 1} other notice(s) could cover this product; they are shown above in order.`;
    el.append(p);
  }
}

// ---------------------------------------------------------------------------
// boot
// ---------------------------------------------------------------------------
// requestSubmit() is a silent no-op while the form's default button is
// disabled, so a keystroke sent mid-request used to vanish and the owner's text
// piled up in the box with no feedback. One send path, guarded by `busy`, and
// the text stays put until it is actually sent.
function sendNow() {
  const v = input.value;
  if (busy || !v.trim()) return;
  input.value = '';
  input.style.height = 'auto';
  submit(v);
}

document.getElementById('form').onsubmit = (e) => {
  e.preventDefault();
  sendNow();
};
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = `${Math.min(input.scrollHeight, 140)}px`;
});
input.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === 'Return') && !e.shiftKey) { e.preventDefault(); sendNow(); }
});

try {
  const init = await rpc('initialize', {
    protocolVersion: SPEC,
    capabilities: {},
    clientInfo: { name: 'housecheck-web', version: '1.0.0' },
  });
  await rpc('notifications/initialized', {}, true);
  const tools = await rpc('tools/list', {});
  document.getElementById('conn').textContent =
    `MCP ${init.protocolVersion} · ${init.serverInfo.name} · ${tools.tools.length} tools`;

  const recent = await callTool('list_recent_recalls', { status: 'Ongoing', classification: 'Class I', limit: 1 });
  const n = recent.structuredContent?.recalls?.[0];
  const hello = say('Tell me what you have and I will check whether <em>your</em> unit is in a recall, not just whether the product was.');
  chips(hello, ['Kroger large eggs', '0 11110-60902 1', 'Boppy newborn lounger']);
  if (n) {
    const p = document.createElement('p');
    p.className = 'aside';
    p.textContent = `Most recent Class I recall in the snapshot: ${n.recall_number}, ${n.report_date}.`;
    hello.append(p);
  }
} catch (err) {
  document.getElementById('conn').textContent = 'server unreachable';
  say(`The MCP server is not answering on this origin. Start it with <code>node src/mcp-server.ts</code> and reload. (${String(err.message ?? err)})`, 'aside');
}
</script>
</body>
</html>
